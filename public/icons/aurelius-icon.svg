<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aurelius IDE">
  <defs>
    <linearGradient id="bg" x1="130" y1="64" x2="894" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2033"/>
      <stop offset="1" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="peak" x1="260" y1="780" x2="760" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="232"/></clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="232" fill="url(#bg)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="230.5" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>

  <!-- horizonte: líneas técnicas -->
  <g clip-path="url(#tile)" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3">
    <path d="M64 800H960"/>
    <path d="M64 860H960" stroke-opacity="0.03"/>
  </g>

  <!-- pico: una sola línea continua que dibuja la "A" -->
  <path d="M268 770 L512 262 L756 770" stroke="url(#peak)" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- travesaño: barra de progreso / cursor -->
  <rect x="380" y="560" width="264" height="64" rx="32" fill="#e9ecf4"/>
</svg>
